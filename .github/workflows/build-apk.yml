name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if [[ -z "${JAVA_HOME:-}" ]]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VER_OUTPUT" | head -n 1 | sed -n 's/.*version "\([^"]*\)".*/\1/p')"
          if [[ -z "$RAW_VERSION" ]]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d'.' -f1 | cut -d'-' -f1)"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [[ -f "$KEYSTORE_PATH" ]]; then
            echo "Temporary debug keystore already exists at $KEYSTORE_PATH; skipping generation."
            exit 0
          fi

          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [[ ! -x "$KEYTOOL_BIN" ]]; then
            echo "::error::keytool executable not found at $KEYTOOL_BIN."
            exit 1
          fi

          "$KEYTOOL_BIN" -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Created temporary debug keystore successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "$EXPECTED_APK" ]]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "$EXPECTED_APK" ]]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "$EXPECTED_APK" ]]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK##*.}" != "apk" ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(wc -c < "$EXPECTED_APK")"
          echo "Verified debug APK: $EXPECTED_APK (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$SOURCE_APK" || ! -s "$SOURCE_APK" ]]; then
            echo "::error::Verified debug APK missing at $SOURCE_APK."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')"
          if [[ -z "$SAFE_REPO_NAME" ]]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/framecut-release-asset.XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp -- "$SOURCE_APK" "$ASSET_PATH"

          if [[ ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "${ASSET_PATH##*.}" != "apk" ]]; then
            echo "::error::Prepared release asset validation failed at $ASSET_PATH."
            exit 1
          fi

          echo "Prepared release asset: $ASSET_FILENAME"
          {
            echo "asset_path=$ASSET_PATH"
            echo "asset_filename=$ASSET_FILENAME"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [[ -z "${ASSET_PATH:-}" || ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "${ASSET_PATH##*.}" != "apk" ]]; then
            echo "::error::Prepared release asset is missing or invalid; aborting release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes.XXXXXX.md")"
          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Release Asset:** \`${ASSET_FILENAME}\`

          > **Note:** This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

          rm -f "$NOTES_FILE"

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [[ "$PUBLISH_OUTCOME" == "success" ]]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "### Debug APK Build & Release Summary"
              echo ""
              echo "- **Build & Artifact Status:** Succeeded (\`app-debug-apk\`)"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release URL:** $RELEASE_URL"
              echo "- **APK Asset:** \`$ASSET_FILENAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Summary (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases failed, but the debug APK build succeeded."
              echo ""
              echo "- **Backup Download:** Download the \`app-debug-apk\` artifact from this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
